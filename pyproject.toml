[project]
name = "eso-armory"
version = "0.2.0-beta.7"
description = "A web armory for your Elder Scrolls Online account"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "bcrypt>=4.0.0",
    "cryptography>=42.0.0",
    "fastapi>=0.136.1",
    "loguru>=0.7.3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.47.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast unit tests",
    "api: FastAPI endpoint tests",
    "ui: Playwright browser tests",
    "slow: slow tests",
]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "scripts/*",
    ".venv/*",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-playwright>=0.8.0",
]
