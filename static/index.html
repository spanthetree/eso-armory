<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESO Armory</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            eso: {
              bg: '#1a1612', card: '#252119', border: '#3d3424',
              gold: '#c9a84c', 'gold-dark': '#8b6914',
              text: '#d4c8a8', muted: '#9a8f76', hover: '#2e2820',
            },
          },
          fontFamily: { cinzel: ['Cinzel','serif'], body: ['Inter','sans-serif'] },
        },
      },
    }
  </script>
  <style>
    body { background:#1a1612; color:#d4c8a8; font-family:'Inter',sans-serif; }
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:#1a1612; }
    ::-webkit-scrollbar-thumb { background:#3d3424; border-radius:3px; }
    ::-webkit-scrollbar-thumb:hover { background:#8b6914; }
    [x-cloak] { display:none !important; }
    .tab-active { border-bottom:2px solid #c9a84c; color:#c9a84c; }

    /* Item icon badge */
    .item-badge { width:32px; height:32px; border-radius:5px; display:flex;
      align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }

    /* Equipment slot */
    .eq-slot { width:40px; height:40px; border-radius:5px; display:flex;
      align-items:center; justify-content:center; font-size:16px;
      border:1px solid #3d3424; position:relative; cursor:default; transition:border-color .15s; }
    .eq-slot:hover { border-color:#c9a84c88; }
    .eq-slot span { color: #c9a84c; }
    .eq-slot.eq-empty { opacity:0.2; pointer-events:none; }
    .eq-section-label { font-size:9px; letter-spacing:.1em; text-transform:uppercase;
      color:#6b5c3e; font-family:'Cinzel',serif; margin-bottom:4px; }

    /* Tooltip */
    #eso-tip {
      position:fixed; z-index:9999; pointer-events:none;
      width:290px; max-height:80vh; overflow:hidden;
      background:linear-gradient(160deg,#1c1810 0%,#13100c 100%);
      border:1px solid #5a4520; border-radius:6px;
      box-shadow:0 8px 32px rgba(0,0,0,.8), inset 0 0 0 1px #c9a84c18;
    }
    #eso-tip .tip-name {
      font-family:'Cinzel',serif; font-weight:700; font-size:15px; line-height:1.3;
    }
    #eso-tip .tip-divider { height:1px; background:linear-gradient(90deg,transparent,#5a4520,transparent); margin:8px 0; }
    #eso-tip .tip-section-header { font-family:'Cinzel',serif; font-size:10px; letter-spacing:.06em; color:#8b6914; text-transform:uppercase; }

    /* Toast */
    .toast { position:fixed; bottom:24px; right:24px; background:#252119;
      border:1px solid #c9a84c; color:#c9a84c; padding:10px 18px;
      border-radius:6px; font-size:14px; z-index:100; font-family:'Cinzel',serif;
      opacity:0; transition:opacity .3s; }
    .toast.show { opacity:1; }
    .cur-icon { width:16px; height:16px; display:inline; vertical-align:middle; image-rendering:auto; }
    .skill-icon { width:24px; height:24px; display:inline-block; vertical-align:middle; }
  </style>
</head>
<body x-data="armory()" x-init="init()"
  @mousemove.window="tipMove($event)"
  x-cloak>

  <!-- Global ESO-style tooltip -->
  <div id="eso-tip" x-show="tip.visible" x-cloak
    :style="`left:${tip.x}px;top:${tip.y}px`">
    <template x-if="tip.item">
      <div>
        <!-- Quality color bar -->
        <div style="height:3px;border-radius:3px 3px 0 0" :style="`background:${tip.item.quality_color}`"></div>

        <div class="p-3">
          <!-- Category row -->
          <div class="flex items-center justify-between mb-1">
            <span class="text-xs text-eso-muted" x-text="tip.item.filter_type_name"></span>
            <span class="text-xs font-medium" :style="`color:${tip.item.quality_color}`"
              x-text="tip.item.quality_name"></span>
          </div>

          <!-- Item name -->
          <div class="tip-name mb-2" :style="`color:${tip.item.quality_color}`"
            x-text="tip.item.name"></div>

          <!-- Set name + bonuses -->
          <template x-if="tip.item.set_name">
            <div class="mb-2">
              <div class="text-xs text-eso-gold/80 font-semibold" x-text="tip.item.set_name"></div>
              <template x-if="tip.item.set_id && setBonusCache[tip.item.set_id]">
                <div class="mt-1 space-y-0.5">
                  <template x-if="setBonusCache[tip.item.set_id]?.loading">
                    <div class="text-[11px] text-eso-muted/60 animate-pulse">Loading bonuses…</div>
                  </template>
                  <template x-if="!setBonusCache[tip.item.set_id]?.loading">
                    <div>
                      <template x-for="b in (setBonusCache[tip.item.set_id]?.bonuses || [])" :key="b.pieces">
                        <div class="text-[11px] leading-snug">
                          <span class="text-eso-gold/50 font-mono" x-text="`(${b.pieces})`"></span>
                          <span class="text-eso-muted ml-1" x-text="b.text"></span>
                        </div>
                      </template>
                      <div class="text-[10px] text-eso-muted/35 mt-1.5">via eso-sets.com</div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>

          <!-- Level badge -->
          <template x-if="tip.item.level > 0">
            <div class="flex items-center gap-3 mb-2 text-xs">
              <span class="text-eso-muted">Level <span class="text-eso-text font-semibold" x-text="tip.item.level"></span></span>
            </div>
          </template>

          <!-- Equipment slot (if equipped somewhere) -->
          <template x-if="tip.slotLabel">
            <div class="text-xs text-eso-muted mb-2">
              Slot: <span class="text-eso-text" x-text="tip.slotLabel"></span>
            </div>
          </template>

          <!-- Decoded item properties -->
          <div class="flex flex-wrap gap-1 mb-2">
            <!-- Trait -->
            <template x-if="tip.item.trait_name">
              <span class="text-xs px-1.5 py-0.5 rounded"
                :style="`background:${tip.item.quality_color}22;color:${tip.item.quality_color};border:1px solid ${tip.item.quality_color}44`">
                <img x-show="tip.item.is_transmuted" src="/assets/services/transmutation_station.png" class="w-3.5 h-3.5 inline-block opacity-70 mr-0.5 align-middle" alt=""><span x-text="tip.item.trait_name"></span>
              </span>
            </template>
            <!-- Style -->
            <template x-if="tip.item.style_name">
              <span class="text-xs px-1.5 py-0.5 rounded text-eso-muted"
                style="background:#3d342430;border:1px solid #3d3424">
                <span x-text="tip.item.style_name"></span>
              </span>
            </template>
            <!-- Weapon subtype -->
            <template x-if="tip.item.weapon_type">
              <span class="text-xs px-1.5 py-0.5 rounded text-eso-muted"
                style="background:#3d342430;border:1px solid #3d3424"
                x-text="tip.item.weapon_type"></span>
            </template>
            <!-- Armor weight -->
            <template x-if="tip.item.armor_type">
              <span class="text-xs px-1.5 py-0.5 rounded text-eso-muted"
                style="background:#3d342430;border:1px solid #3d3424"
                x-text="tip.item.armor_type"></span>
            </template>
            <!-- Enchant name (falls back to generic badge) -->
            <template x-if="tip.item.is_enchanted">
              <span class="text-xs px-1.5 py-0.5 rounded"
                style="background:#5199ff18;color:#5199ff;border:1px solid #5199ff44"
                x-text="tip.item.enchant_name || 'Enchanted'"></span>
            </template>
            <template x-if="tip.item.is_crafted">
              <span class="text-xs px-1.5 py-0.5 rounded"
                style="background:#2dc50e18;color:#2dc50e;border:1px solid #2dc50e44">Crafted</span>
            </template>
            <template x-if="tip.item.is_stolen">
              <span class="text-xs px-1.5 py-0.5 rounded"
                style="background:#ef444418;color:#ef4444;border:1px solid #ef444444">Stolen</span>
            </template>
          </div>

          <div class="tip-divider"></div>

          <!-- Locations -->
          <div class="tip-section-header mb-1.5">Locations</div>
          <div class="space-y-1">
            <template x-for="loc in tip.item.locations" :key="loc.location_key + loc.bag_id">
              <div class="flex items-start justify-between gap-2 text-xs">
                <div class="min-w-0">
                  <span class="text-eso-text truncate block" x-text="loc.location_type==='character' ? loc.location_label : loc.bag_label"></span>
                  <span class="text-eso-muted" x-show="loc.location_type==='character'" x-text="loc.bag_label"></span>
                </div>
                <span class="text-eso-muted flex-shrink-0 mt-0.5">×<span x-text="loc.quantity"></span></span>
              </div>
            </template>
          </div>

          <!-- Total if multiple locations -->
          <template x-if="tip.item.locations.length > 1">
            <div class="tip-divider"></div>
            <div class="flex justify-between text-xs">
              <span class="text-eso-muted">Total</span>
              <span class="text-eso-text font-semibold">×<span x-text="tip.item.total_quantity"></span></span>
            </div>
          </template>
        </div>
      </div>
    </template>
    <template x-if="tip.achiev">
      <div>
        <div style="height:3px;border-radius:3px 3px 0 0;background:#8b6914"></div>
        <div class="p-3">
          <div class="flex items-center justify-between mb-1">
            <span class="text-xs text-eso-muted" x-text="tip.achiev.cat + (tip.achiev.subcat ? ' › ' + tip.achiev.subcat : '')"></span>
            <span class="text-xs" :style="tip.achiev.complete ? 'color:#c9a84c' : 'color:#9a8f76'"
              x-text="tip.achiev.complete ? '✓ Completed' : 'Incomplete'"></span>
          </div>
          <div class="tip-name mb-2" style="color:#c9a84c" x-text="tip.achiev.name"></div>
          <p class="text-xs text-eso-muted leading-snug mb-2" x-text="tip.achiev.desc"></p>
          <div class="tip-divider"></div>
          <div class="flex items-center justify-between text-xs">
            <span class="text-eso-muted" x-text="tip.achiev.points + ' Achievement Points'"></span>
            <span x-show="tip.achiev.complete" class="text-eso-muted/70" x-text="tip.achiev.completionDate"></span>
          </div>
          <template x-if="!tip.achiev.complete && tip.achiev.criteria.length">
            <div class="mt-2 space-y-1.5">
              <template x-for="c in tip.achiev.criteria" :key="c.desc">
                <div>
                  <div class="flex justify-between text-[10px] text-eso-muted mb-0.5">
                    <span class="truncate flex-1" x-text="c.desc"></span>
                    <span class="shrink-0 ml-2"
                      :class="c.cur >= c.req ? 'text-eso-gold/70' : ''"
                      x-text="`${c.cur}/${c.req}`"></span>
                  </div>
                  <template x-if="c.req > 1">
                    <div class="w-full h-1 rounded-full overflow-hidden" style="background:#1a1612">
                      <div class="h-full rounded-full"
                        :style="`background:#8b6914;width:${Math.min(100,Math.round(c.cur/c.req*100))}%`"></div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>
    <!-- Stickerbook set tooltip -->
    <template x-if="tip.sbSet">
      <div>
        <div style="height:3px;border-radius:3px 3px 0 0;background:#c9a84c"></div>
        <div class="p-3">
          <div class="flex items-center justify-between mb-1">
            <span class="text-xs text-eso-muted" x-text="tip.sbSet.subcategory || tip.sbSet.category"></span>
            <span class="text-xs" :class="tip.sbSet.complete ? 'text-eso-gold' : 'text-eso-muted'"
              x-text="tip.sbSet.numCollected + '/' + tip.sbSet.numTotal + ' pieces'"></span>
          </div>
          <div class="tip-name mb-2" style="color:#c9a84c" x-text="tip.sbSet.name"></div>
          <!-- Progress bar -->
          <div class="h-1.5 bg-eso-border rounded-full overflow-hidden mb-3">
            <div class="h-full rounded-full" :class="tip.sbSet.complete ? 'bg-eso-gold' : 'bg-eso-gold/50'"
              :style="'width:' + Math.round(tip.sbSet.numCollected/Math.max(tip.sbSet.numTotal,1)*100) + '%'"></div>
          </div>
          <!-- Set bonuses -->
          <template x-if="setBonusCache[tip.sbSet.setId]">
            <div class="mb-2 space-y-0.5">
              <template x-if="setBonusCache[tip.sbSet.setId]?.loading">
                <div class="text-[11px] text-eso-muted/60 animate-pulse">Loading bonuses…</div>
              </template>
              <template x-if="!setBonusCache[tip.sbSet.setId]?.loading">
                <div>
                  <template x-for="b in (setBonusCache[tip.sbSet.setId]?.bonuses || [])" :key="b.pieces">
                    <div class="text-[11px] leading-snug mb-0.5">
                      <span class="text-eso-gold/50 font-mono" x-text="`(${b.pieces})`"></span>
                      <span class="text-eso-muted ml-1" x-text="b.text"></span>
                    </div>
                  </template>
                  <div class="tip-divider"></div>
                  <div class="text-[10px] text-eso-gold/50 hover:text-eso-gold cursor-pointer"
                    @click="window.open(setEsoSetsUrl(tip.sbSet.name), '_blank')">
                    View on eso-sets.com ↗
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </template>
    <!-- Skill tooltip -->
    <template x-if="tip.skill">
      <div>
        <div style="height:3px;border-radius:3px 3px 0 0;background:#5199ff88"></div>
        <div class="p-3">
          <div class="tip-name mb-2" style="color:#8ab4ff" x-text="tip.skill.name"></div>
          <template x-if="skillInfoCache[tip.skill.slug]">
            <div>
              <template x-if="skillInfoCache[tip.skill.slug]?.loading">
                <div class="text-xs text-eso-muted/60 animate-pulse">Loading skill info…</div>
              </template>
              <template x-if="!skillInfoCache[tip.skill.slug]?.loading">
                <div>
                  <div class="flex flex-wrap gap-1 mb-2">
                    <template x-if="skillInfoCache[tip.skill.slug]?.type">
                      <span class="text-xs px-1.5 py-0.5 rounded text-eso-muted"
                        style="background:#5199ff18;border:1px solid #5199ff33"
                        x-text="skillInfoCache[tip.skill.slug].type"></span>
                    </template>
                    <template x-if="skillInfoCache[tip.skill.slug]?.location">
                      <span class="text-xs px-1.5 py-0.5 rounded text-eso-muted"
                        style="background:#3d342430;border:1px solid #3d3424"
                        x-text="skillInfoCache[tip.skill.slug].location"></span>
                    </template>
                  </div>
                  <div class="flex flex-wrap gap-3 mb-2 text-xs text-eso-muted">
                    <template x-if="skillInfoCache[tip.skill.slug]?.cost">
                      <span>Cost: <span class="text-eso-text" x-text="skillInfoCache[tip.skill.slug].cost"></span></span>
                    </template>
                    <template x-if="skillInfoCache[tip.skill.slug]?.cast_time">
                      <span>Cast: <span class="text-eso-text" x-text="skillInfoCache[tip.skill.slug].cast_time"></span></span>
                    </template>
                    <template x-if="skillInfoCache[tip.skill.slug]?.target">
                      <span>Target: <span class="text-eso-text" x-text="skillInfoCache[tip.skill.slug].target"></span></span>
                    </template>
                    <template x-if="skillInfoCache[tip.skill.slug]?.range">
                      <span>Range: <span class="text-eso-text" x-text="skillInfoCache[tip.skill.slug].range"></span></span>
                    </template>
                  </div>
                  <template x-if="skillInfoCache[tip.skill.slug]?.description">
                    <div>
                      <div class="tip-divider"></div>
                      <p class="text-xs text-eso-muted leading-snug" x-text="skillInfoCache[tip.skill.slug].description"></p>
                    </div>
                  </template>
                  <div class="text-[10px] text-eso-muted/35 mt-1.5">via eso-skillbook.com</div>
                </div>
              </template>
            </div>
          </template>
          <template x-if="!skillInfoCache[tip.skill.slug]">
            <div class="text-xs text-eso-muted/60 animate-pulse">Loading…</div>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- Toast notification -->
  <div class="toast" :class="{ show: toastVisible }" x-text="toastMsg"></div>

  <!-- Header -->
  <header class="border-b border-eso-border sticky top-0 z-40"
    style="background:#1a1612ee;backdrop-filter:blur(6px)">
    <div class="max-w-screen-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-2xl">⚔️</span>
        <div>
          <h1 class="font-cinzel font-bold text-eso-gold text-xl leading-none">ESO Armory</h1>
          <p class="text-eso-muted text-xs mt-0.5" x-show="data"
            x-text="data ? `${data.meta.account} · ${data.meta.server} · ${data.meta.item_count.toLocaleString()} items` : ''"></p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <span x-show="loading" class="text-eso-muted text-sm animate-pulse">Loading…</span>
        <span x-show="error && !loading" class="text-red-400 text-sm" x-text="error"></span>
        <span x-show="data && !loading" class="flex items-center gap-4 text-xs text-eso-muted">
          <span><span x-text="data ? data.meta.character_count : 0"></span> characters</span>
          <span class="flex items-center gap-1"><img src="/assets/currencies/gold.png" class="cur-icon"> <span x-text="fmtGold(totalGold)"></span></span>
          <span x-show="totalAP > 0" class="flex items-center gap-1"><img src="/assets/currencies/ap.png" class="cur-icon"> <span x-text="fmtNum(totalAP)"></span> AP</span>
          <span x-show="totalTV > 0" class="flex items-center gap-1"><img src="/assets/currencies/tv.png" class="cur-icon"> <span x-text="fmtNum(totalTV)"></span> TV</span>
          <span x-show="totalWV > 0" class="flex items-center gap-1"><img src="/assets/currencies/wv.png" class="cur-icon"> <span x-text="fmtNum(totalWV)"></span> WV</span>
        </span>
      </div>
    </div>
    <!-- Tabs -->
    <div class="max-w-screen-xl mx-auto px-4 flex gap-6" x-show="data">
      <button @click="tab='characters'; selectedChar=null; tipHide()"
        class="py-2 text-sm font-medium transition-colors"
        :class="tab==='characters' ? 'tab-active' : 'text-eso-muted hover:text-eso-text'">
        Characters
      </button>
      <button @click="tab='inventory'; tipHide()"
        class="py-2 text-sm font-medium transition-colors"
        :class="tab==='inventory' ? 'tab-active' : 'text-eso-muted hover:text-eso-text'">
        Inventory
      </button>
      <button @click="tab='achievements'; tipHide()"
        class="py-2 text-sm font-medium transition-colors"
        :class="tab==='achievements' ? 'tab-active' : 'text-eso-muted hover:text-eso-text'">
        Achievements
      </button>
      <button @click="tab='stickerbook'; tipHide()"
        class="py-2 text-sm font-medium transition-colors"
        :class="tab==='stickerbook' ? 'tab-active' : 'text-eso-muted hover:text-eso-text'">
        Collections
      </button>
    </div>
  </header>

  <main class="max-w-screen-xl mx-auto px-4 py-6">

    <!-- Loading -->
    <div x-show="loading" class="flex items-center justify-center h-64">
      <div class="text-center">
        <div class="text-4xl mb-3">⚔️</div>
        <p class="font-cinzel text-eso-gold animate-pulse">Loading Armory…</p>
      </div>
    </div>

    <!-- Error -->
    <div x-show="error && !loading && !data"
      class="bg-red-900/20 border border-red-700 rounded-lg p-6 text-center">
      <p class="text-red-400 font-cinzel text-lg mb-2">Failed to load data</p>
      <p class="text-eso-muted text-sm" x-text="error"></p>
    </div>

    <!-- ===== CHARACTERS TAB ===== -->
    <div x-show="tab === 'characters' && data">

      <!-- Character grid -->
      <div x-show="!selectedChar" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
        <template x-for="char in sortedCharacters" :key="char.id">
          <div class="bg-eso-card border border-eso-border rounded-lg p-4 cursor-pointer hover:border-eso-gold/40 transition-colors"
            @click="selectChar(char)"
            :class="charBuilds(char.id).length ? 'ring-1 ring-eso-gold/20' : ''">
            <!-- Character header -->
            <div class="flex items-start justify-between mb-3">
              <div>
                <h2 class="font-cinzel font-semibold text-eso-gold text-base" x-text="char.name"></h2>
                <div class="flex gap-3 mt-1 text-xs text-eso-muted">
                  <span class="flex items-center gap-0.5"><img src="/assets/currencies/gold.png" class="cur-icon"> <span x-text="fmtGold(char.gold)"></span></span>
                  <span x-show="char.ap > 0" class="flex items-center gap-0.5"><img src="/assets/currencies/ap.png" class="cur-icon"> <span x-text="fmtNum(char.ap)"></span> AP</span>
                  <span x-show="char.tv > 0" class="flex items-center gap-0.5"><img src="/assets/currencies/tv.png" class="cur-icon"> <span x-text="fmtNum(char.tv)"></span> TV</span>
                </div>
              </div>
              <div class="text-xs text-eso-muted text-right">
                <div class="flex items-center justify-end gap-1 mb-1.5">
                  <img x-show="char.class" :src="classIcon(char.class)" :title="char.class" class="cur-icon opacity-70">
                  <img x-show="char.race" :src="raceIcon(char.race)" :title="char.race" class="cur-icon opacity-70">
                  <img x-show="char.alliance" :src="allianceIcon(char.alliance)" :title="char.alliance" class="cur-icon opacity-70">
                </div>
                <div x-text="`${char.space_used} / ${char.space_max} slots`"></div>
                <div class="mt-1 w-24 h-1.5 bg-eso-bg rounded-full overflow-hidden">
                  <div class="h-full rounded-full transition-all"

                  <div class="h-full rounded-full transition-all"
                    :style="selectedChar ? `width:${selectedChar.space_max ? Math.round(selectedChar.space_used/selectedChar.space_max*100) : 0}%;background:${spaceColor(selectedChar)}` : ''"></div>
                </div>
              </div>
            </div>
            <div class="border-t border-eso-border pt-3">
              <p class="eq-section-label">Apparel</p>

                <div class="eq-slot" style="grid-column:3;grid-row:3" :class="!sl[8]&&'eq-empty'" :style="sl[8]?`background:${sl[8].item.quality_color}18;border-color:${sl[8].item.quality_color}55`:''" @mouseenter="sl[8]&&tipShowSlot(sl[8].item,slotLabel(8),$event)" @mouseleave="tipHide()"><span x-show="!!sl[8]" x-html="sl[8]?slotEquipIcon(8,sl[8].item):''"></span></div>
                <div class="eq-slot" style="grid-column:3;grid-row:4" :class="!sl[9]&&'eq-empty'" :style="sl[9]?`background:${sl[9].item.quality_color}18;border-color:${sl[9].item.quality_color}55`:''" @mouseenter="sl[9]&&tipShowSlot(sl[9].item,slotLabel(9),$event)" @mouseleave="tipHide()"><span x-show="!!sl[9]" x-html="sl[9]?slotEquipIcon(9,sl[9].item):''"></span></div>
              </div>
              <p class="eq-section-label">Accessories</p>

                  <div class="flex items-center justify-between cursor-pointer select-none"

                    <h3 class="font-cinzel font-semibold text-eso-gold text-sm" x-text="build.name"></h3>
                    <div class="flex items-center gap-2 text-xs text-eso-muted">
                      <span x-text="build.zone + ' · ' + build.page_name"></span>
                      <span class="w-3 text-center" x-text="open ? '▼' : '▶'"></span>
                    </div>
                  </div>

                  <!-- Collapsible body -->
                  <div x-show="open" class="mt-3">

                  <!-- Gear -->
                  <div class="space-y-0.5 text-xs">
                    <template x-for="g in build.gear" :key="g.slot">
                      <div class="flex items-center gap-2 py-0.5"
                        @mouseenter="buildTipShow(g, $event)" @mouseleave="tipHide()">
                        <span class="text-eso-muted shrink-0 w-24" x-text="g.slot_name"></span>
                        <span :style="`color:${wwGearColor(g)}`" class="truncate" x-text="wwGearName(g)"></span>
                      </div>
                    </template>
                  </div>

                  <!-- Skills -->
                  <template x-if="buildHasSkills(build)">
                    <div class="mt-3 pt-2 border-t border-eso-border/40">
                      <p class="text-xs text-eso-muted uppercase tracking-wider mb-1.5">Skills</p>
                      <template x-for="bar in ['primary','backup']" :key="bar">
                        <div x-show="build.skills && build.skills[bar] && Object.keys(build.skills[bar]).length"

                          <p class="text-xs text-eso-muted/60 mb-0.5 capitalize" x-text="bar + ' bar'"></p>
                          <div class="flex gap-1 flex-wrap">
                            <template x-for="slot in [3,4,5,6,7,8]" :key="slot">
                              <div x-show="build.skills[bar] && build.skills[bar][slot]"
                                class="text-xs bg-eso-bg border border-eso-border rounded px-1.5 py-0.5 text-eso-text cursor-pointer"
                                :class="slot === 8 ? 'border-eso-gold/40 text-eso-gold' : ''"
                                @mouseenter="tipShowSkill(build.skills[bar]?.[slot], $event)"
                                @mouseleave="tipHide()"
                                @click="openSkillbook(build.skills[bar]?.[slot])"
                                x-html="build.skills[bar] ? abilitySlotHtml(build.skills[bar][slot], slot===8) : ''">
                              </div>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>

                  <!-- Champion Points -->
                  <template x-if="buildHasCP(build)">
                    <div class="mt-3 pt-2 border-t border-eso-border/40">
                      <p class="text-xs text-eso-muted uppercase tracking-wider mb-1.5">Champion Points</p>
                      <div class="grid grid-cols-3 gap-x-3 gap-y-0.5 text-xs">

                          <div>
                            <p class="flex items-center gap-1 font-medium mb-0.5" :style="`color:${group.color}`">
                              <img :src="group.icon" class="cur-icon"><span x-text="group.label"></span>
                            </p>
                            <template x-for="slot in group.slots" :key="slot">
                              <div x-show="build.cp && build.cp[slot] && build.cp[slot] > 0"
                                class="text-eso-muted truncate"
                                x-text="build.cp ? cpName(build.cp[slot]) : ''">
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </div>
                  </template>

                  <!-- Food -->
                  <template x-if="build.food">
                    <div class="mt-3 pt-2 border-t border-eso-border/40 text-xs text-eso-muted">
                      🍖 <span x-text="build.food.link_name || itemIdMap[build.food.item_id]?.name || (build.food.item_id ? 'Item #' + build.food.item_id : '—')"></span>
                    </div>
                  </template>

                  </div><!-- end collapsible body -->
                </div>
              </template>
            </div>
          </div>
        </div>
      </div><!-- end detail view -->

    </div>

    <!-- ===== INVENTORY TAB ===== -->
    <div x-show="tab === 'inventory' && data">

          <!-- Type multiselect -->
          <div class="relative" x-data="{ open: false }" @click.outside="open = false">

                <div @click="toggleFilter(filterTypes, opt.v)"

              </template>
            </div>
          </div>

          <!-- Location multiselect -->
          <div class="relative" x-data="{ open: false }" @click.outside="open = false">

              :class="filterLocTypes.length ? 'border-eso-gold/60 text-eso-gold' : 'border-eso-border text-eso-text'">
              <span class="truncate flex-1 text-left" x-text="filterLocTypeLabel"></span>
              <span class="text-eso-muted text-xs shrink-0" x-text="open ? '▴' : '▾'"></span>
            </button>
            <div x-show="open" x-cloak class="absolute top-full left-0 mt-1 z-50 bg-eso-card border border-eso-border rounded-lg shadow-xl min-w-40 py-1">
              <template x-for="opt in [{v:'character',l:'Characters'},{v:'bank',l:'Bank'},{v:'craftbag',l:'Craft Bag'},{v:'house_chest',l:'House Chests'}]" :key="opt.v">
                <div @click="toggleFilter(filterLocTypes, opt.v)"
                  class="px-3 py-1.5 cursor-pointer text-sm transition-colors select-none"
                  :class="filterLocTypes.includes(opt.v) ? 'bg-eso-gold/10 text-eso-gold' : 'text-eso-text hover:bg-eso-hover'"
                  x-text="opt.l"></div>
              </template>
            </div>
          </div>

          <!-- Character multiselect -->
          <div class="relative" x-data="{ open: false }" @click.outside="open = false">
            <button @click="open = !open"
              class="flex items-center gap-1.5 bg-eso-bg border rounded px-2 py-1.5 text-sm focus:outline-none transition-colors min-w-36"
              :class="filterChars.length ? 'border-eso-gold/60 text-eso-gold' : 'border-eso-border text-eso-text'">
              <span class="truncate flex-1 text-left" x-text="filterCharLabel"></span>
              <span class="text-eso-muted text-xs shrink-0" x-text="open ? '▴' : '▾'"></span>
            </button>
            <div x-show="open" x-cloak class="absolute top-full left-0 mt-1 z-50 bg-eso-card border border-eso-border rounded-lg shadow-xl min-w-44 py-1">
              <template x-for="char in sortedCharacters" :key="char.id">
                <div @click="toggleFilter(filterChars, char.id)"
                  class="px-3 py-1.5 cursor-pointer text-sm transition-colors select-none"
                  :class="filterChars.includes(char.id) ? 'bg-eso-gold/10 text-eso-gold' : 'text-eso-text hover:bg-eso-hover'"
                  x-text="char.name"></div>
              </template>
            </div>
          </div>

          <!-- Trait multiselect -->
          <div class="relative" x-data="{ open: false }" @click.outside="open = false">
            <button @click="open = !open"
              class="flex items-center gap-1.5 bg-eso-bg border rounded px-2 py-1.5 text-sm focus:outline-none transition-colors min-w-32"
              :class="filterTraits.length ? 'border-eso-gold/60 text-eso-gold' : 'border-eso-border text-eso-text'">
              <span class="truncate flex-1 text-left" x-text="filterTraitLabel"></span>
              <span class="text-eso-muted text-xs shrink-0" x-text="open ? '▴' : '▾'"></span>
            </button>
            <div x-show="open" x-cloak class="absolute top-full left-0 mt-1 z-50 bg-eso-card border border-eso-border rounded-lg shadow-xl min-w-44 py-1 max-h-72 overflow-y-auto">
              <div @click="toggleFilter(filterTraits, 'any')"
                class="px-3 py-1.5 cursor-pointer text-sm transition-colors select-none"
                :class="filterTraits.includes('any') ? 'bg-eso-gold/10 text-eso-gold' : 'text-eso-text hover:bg-eso-hover'">
                Has Trait
              </div>
              <div class="px-3 pt-2 pb-0.5 text-[10px] text-eso-muted uppercase tracking-wider font-cinzel border-t border-eso-border/40 mt-1">Armor</div>
              <template x-for="opt in [{v:'18',l:'Divines'},{v:'16',l:'Infused'},{v:'25',l:'Nirnhoned'},{v:'13',l:'Reinforced'},{v:'11',l:'Sturdy'},{v:'14',l:'Well-Fitted'},{v:'12',l:'Impenetrable'},{v:'15',l:'Training'}]" :key="opt.v">
                <div @click="toggleFilter(filterTraits, opt.v)"
                  class="px-3 py-1.5 cursor-pointer text-sm transition-colors select-none"
                  :class="filterTraits.includes(opt.v) ? 'bg-eso-gold/10 text-eso-gold' : 'text-eso-text hover:bg-eso-hover'"
                  x-text="opt.l"></div>
              </template>
              <div class="px-3 pt-2 pb-0.5 text-[10px] text-eso-muted uppercase tracking-wider font-cinzel border-t border-eso-border/40 mt-1">Weapon</div>

                <div @click="toggleFilter(filterTraits, opt.v)"
                  class="px-3 py-1.5 cursor-pointer text-sm transition-colors select-none"
                  :class="filterTraits.includes(opt.v) ? 'bg-eso-gold/10 text-eso-gold' : 'text-eso-text hover:bg-eso-hover'"
                  x-text="opt.l"></div>
              </template>
              <div class="px-3 pt-2 pb-0.5 text-[10px] text-eso-muted uppercase tracking-wider font-cinzel border-t border-eso-border/40 mt-1">Jewelry</div>
              <template x-for="opt in [{v:'32',l:'Protective'},{v:'29',l:'Harmony'},{v:'31',l:'Bloodthirsty'},{v:'30',l:'Triune'},{v:'33',l:'Infused'},{v:'28',l:'Swift'},{v:'22',l:'Arcane'},{v:'21',l:'Healthy'},{v:'23',l:'Robust'}]" :key="opt.v">
                <div @click="toggleFilter(filterTraits, opt.v)"
                  class="px-3 py-1.5 cursor-pointer text-sm transition-colors select-none"
                  :class="filterTraits.includes(opt.v) ? 'bg-eso-gold/10 text-eso-gold' : 'text-eso-text hover:bg-eso-hover'"
                  x-text="opt.l"></div>
              </template>
            </div>
          </div>
        </div>

        <!-- Row 2: Quality pills + toggle buttons + count -->
        <div class="flex flex-wrap gap-1.5 items-center">
          <template x-for="q in qualityOptions" :key="q.value">
            <button @click="filterQuality = filterQuality === q.value ? '' : q.value"
              class="px-2 py-1 rounded text-xs font-medium border transition-all"
              :style="`border-color:${filterQuality===q.value ? q.color : '#3d3424'};color:${q.color};background:${filterQuality===q.value ? q.color+'22' : 'transparent'}`"
              x-text="q.label">
            </button>
          </template>

          <div class="w-px h-4 bg-eso-border mx-0.5 shrink-0"></div>

          <button @click="filterTransmuted = !filterTransmuted"
            class="flex items-center gap-1 px-2 py-1 rounded text-xs font-medium border transition-all"
            :class="filterTransmuted ? 'border-eso-gold bg-eso-gold/10 text-eso-gold' : 'border-eso-border text-eso-muted hover:text-eso-text'">
            <img src="/assets/services/transmutation_station.png" class="w-3.5 h-3.5 opacity-80" alt="">
            Transmuted
          </button>

          <button @click="filterCrafted = !filterCrafted"
            class="flex items-center gap-1 px-2 py-1 rounded text-xs font-medium border transition-all"
            :class="filterCrafted ? 'border-eso-gold bg-eso-gold/10 text-eso-gold' : 'border-eso-border text-eso-muted hover:text-eso-text'">
            Crafted
          </button>

          <div class="w-px h-4 bg-eso-border mx-0.5 shrink-0"></div>

          <button @click="filterGroupBySet = !filterGroupBySet"
            class="flex items-center gap-1 px-2 py-1 rounded text-xs font-medium border transition-all"
            :class="filterGroupBySet ? 'border-eso-gold bg-eso-gold/10 text-eso-gold' : 'border-eso-border text-eso-muted hover:text-eso-text'">

          </button>

          <button x-show="hasActiveFilters"
            @click="search='';filterQuality='';filterTypes=[];filterLocTypes=[];filterChars=[];filterTraits=[];filterTransmuted=false;filterCrafted=false;filterGroupBySet=false"
            class="text-eso-muted text-xs hover:text-eso-text px-2 py-1 border border-eso-border rounded transition-colors">

          </button>

          <span class="text-eso-muted text-xs ml-auto">
            <span x-text="filteredItems.length.toLocaleString()"></span> items
          </span>
        </div>

                <th class="text-left px-3 py-2 cursor-pointer hover:text-eso-gold select-none"
                  @click="setSort('name')">

                <th class="text-left px-3 py-2 cursor-pointer hover:text-eso-gold select-none hidden md:table-cell"

                </th>
                <th class="text-left px-3 py-2 cursor-pointer hover:text-eso-gold select-none hidden sm:table-cell"

                </th>
                <th class="text-right px-3 py-2 cursor-pointer hover:text-eso-gold select-none w-16"

                </th>
                <th class="text-left px-3 py-2 hidden lg:table-cell">Where</th>

            </thead>
            <tbody>
              <template x-for="row in displayItems" :key="row.t === 'h' ? 'h_' + row.set : row.item.key">

                    ? 'bg-eso-bg/60 border-b border-eso-border'
                    : 'border-b border-eso-border/40 hover:bg-eso-hover transition-colors'"
                  :style="row.t === 'item' && row.item?.set_name ? 'cursor:pointer' : ''"
                  @mouseenter="row.t === 'item' && tipShow(row.item, $event)" @mouseleave="tipHide()"
                  @click="row.t === 'item' && row.item?.set_name && window.open(setEsoSetsUrl(row.item.set_name), '_blank')">
                  <!-- Group header -->
                  <td x-show="row.t === 'h'" colspan="6" class="px-3 py-1.5">
                    <span class="font-cinzel text-xs text-eso-gold tracking-wide"
                      :class="row.set && row.set !== 'No Set' ? 'cursor-pointer hover:underline' : ''"
                      @click.stop="row.set && row.set !== 'No Set' && window.open(setEsoSetsUrl(row.set), '_blank')"
                      x-text="row.set"></span>
                    <span class="text-[10px] text-eso-muted ml-2" x-text="row.count ? `(${row.count})` : ''"></span>
                  </td>
                  <!-- Category badge -->
                  <td x-show="row.t === 'item'" class="px-3 py-2">

                      <span x-html="row.item ? itemIconHtml(row.item) : ''"></span>

                  </td>
                  <!-- Name -->
                  <td x-show="row.t === 'item'" class="px-3 py-2">
                    <span class="font-medium" :style="`color:${row.item?.quality_color}`"
                      x-text="row.item?.name"></span>
                    <span x-show="row.item?.level > 0"
                      class="ml-2 text-xs text-eso-muted" x-text="row.item ? `Lv.${row.item.level}` : ''"></span>
                  </td>
                  <!-- Type -->
                  <td x-show="row.t === 'item'" class="px-3 py-2 text-eso-muted hidden md:table-cell"
                    x-text="row.item?.filter_type_name"></td>
                  <!-- Quality -->
                  <td x-show="row.t === 'item'" class="px-3 py-2 hidden sm:table-cell">
                    <span class="text-xs" :style="`color:${row.item?.quality_color}`"
                      x-text="row.item?.quality_name"></span>
                  </td>
                  <!-- Qty -->
                  <td x-show="row.t === 'item'" class="px-3 py-2 text-right text-eso-muted font-mono"
                    x-text="row.item ? row.item.total_quantity.toLocaleString() : ''"></td>
                  <!-- Locations summary -->
                  <td x-show="row.t === 'item'" class="px-3 py-2 hidden lg:table-cell">
                    <div class="flex flex-wrap gap-1">
                      <template x-for="loc in (row.item?.locations || []).slice(0,2)" :key="loc.location_key+loc.bag_id">
                        <span class="text-[11px] text-eso-muted border border-eso-border rounded px-1.5 py-0.5"
                          x-text="(loc.location_type==='character' ? loc.location_label+' · '+loc.bag_label : loc.bag_label) + (row.item.locations.length > 1 ? ' ×'+loc.quantity : '')"></span>
                      </template>
                      <span x-show="(row.item?.locations || []).length > 2"
                        class="text-[11px] text-eso-muted"
                        x-text="row.item ? `+${row.item.locations.length-2} more` : ''"></span>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
        <div x-show="filteredItems.length === 0" class="text-center py-12 text-eso-muted">
          No items match your filters
        </div>
      </div>
    </div>


    <!-- ===== ACHIEVEMENTS TAB ===== -->
    <div x-show="tab === 'achievements' && data" x-cloak>
      <template x-if="!achievData">

      </template>
      <template x-if="achievData">
        <div class="flex h-[calc(100vh-9.5rem)] border border-eso-border rounded-lg overflow-hidden">

            <button @click="achievView='summary'; achievCat=null"
              class="w-full text-left px-4 py-3 border-b border-eso-border transition-colors font-cinzel text-xs tracking-widest font-semibold"
              :class="achievView==='summary' ? 'text-eso-gold bg-eso-hover' : 'text-eso-text hover:bg-eso-hover/50'">

            </button>

                </div>
                <div class="w-full h-1 bg-eso-bg rounded-full overflow-hidden">
                  <div class="h-full rounded-full"
                    :style="`background:#8b6914;width:${cat.totalPts ? Math.round(cat.earnedPts/cat.totalPts*100) : 0}%`"></div>
                </div>

              <select x-model="achievCharId"
                class="bg-eso-bg border border-eso-border rounded px-2 py-1 text-sm text-eso-text focus:outline-none focus:border-eso-gold">
                <template x-for="c in achievData.chars" :key="c.id">

            <div x-show="achievView==='summary'" class="p-5">

                <span class="font-cinzel text-sm text-eso-gold">

                </span>
              </div>

              <!-- Recent achievements -->
              <template x-if="achievData.recent.length">

                                  x-text="p.name || ('Piece ' + (i+1))"
                                  @click.stop="window.open(ttcUrl(p.name || s.name), '_blank')"></span>
                              </div>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </template>

          </div><!-- end right pane -->
        </div>
      </template>
    </div>

  </main>

<script>
function armory() {
  return {
    data: null,
    charMaps: {},
    itemIdMap: {},
    builds: null,
    buildsError: null,
    wwBuilds: null,
    achievData: null,
    achievView: 'summary',
    achievCat: null,
    achievCharId: null,
    _achievIndexByChar: {},
    sbData: null,
    sbCat: null,
    sbSearch: '',
    abilityIcons: {},
    selectedChar: null,
    loading: true,
    ready: false,
    error: null,
    tab: 'characters',
    toastVisible: false,
    toastMsg: '',

    // Inventory filters
    search: '',
    filterQuality: '',
    filterTypes: [],
    filterLocTypes: [],
    filterChars: [],
    filterTraits: [],
    filterTransmuted: false,
    filterCrafted: false,
    filterGroupBySet: false,
    sortKey: 'name',
    sortDir: 'asc',

    // Tooltip state
    tip: { visible: false, item: null, achiev: null, skill: null, sbSet: null, slotLabel: null, x: 0, y: 0 },
    setBonusCache: {},
    skillInfoCache: {},

    qualityOptions: [
      { value:'0', label:'Trash',     color:'#8b8b8b' },
      { value:'1', label:'Normal',    color:'#cccccc' },
      { value:'2', label:'Fine',      color:'#2dc50e' },
      { value:'3', label:'Superior',  color:'#5199ff' },
      { value:'4', label:'Epic',      color:'#a02ee4' },
      { value:'5', label:'Legendary', color:'#c29300' },
      { value:'6', label:'Mythic',    color:'#e87800' },
    ],

    slotLabels: {
      0:'Head', 1:'Neck', 2:'Chest', 3:'Shoulders',
      4:'Main Hand', 5:'Off Hand', 6:'Waist',
      8:'Legs', 9:'Feet', 10:'Costume',
      11:'Ring 1', 12:'Ring 2', 13:'Poison',
      14:'Backup Poison', 16:'Gloves', 20:'Backup Main', 21:'Backup Off',
    },

    async init() {
      await Promise.all([
        this.fetchData(),
        this.fetchBuilds(),
        this.fetchWWBuilds(),
        this.fetchAbilityIcons(),
        this.fetchAchievements(),
        this.fetchStickerbook(),
      ]);
      this.ready = true;
      this.connectSSE();
    },

    async fetchData(silent = false) {
      if (!silent) this.loading = true;
      this.error = null;
      try {
        const r = await fetch('/api/data');
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        this.data = await r.json();
        if (this.data.error) throw new Error(this.data.error);
        this.buildCharMaps();
        this.buildItemIdMap();
      } catch(e) {
        this.error = e.message;
      } finally {
        if (!silent) this.loading = false;
      }
    },

    async fetchBuilds() {
      try {
        const r = await fetch('/api/builds');
        if (!r.ok) { this.buildsError = `HTTP ${r.status}`; return; }
        const d = await r.json();
        if (d.error) { this.buildsError = d.error; return; }
        this.builds = d;
      } catch(e) {
        this.buildsError = e.message;
      }
    },

    async fetchWWBuilds() {
      try {
        const r = await fetch('/api/ww_builds');
        if (!r.ok) return;
        const d = await r.json();
        if (d.error) return;
        this.wwBuilds = d;
      } catch(e) {}
    },

    async fetchAchievements() {
      try {
        const r = await fetch('/api/achievements');
        if (!r.ok) return;
        const d = await r.json();
        if (d.error) return;
        this.achievData = d;
        const byChar = {};
        for (const [charId, items] of Object.entries(d.items_by_char || {})) {
          const idx = {};
          for (const a of items) {
            const key = a.cat + '||' + a.subcat;
            if (!idx[key]) idx[key] = [];
            idx[key].push(a);
          }
          byChar[charId] = idx;
        }
        this._achievIndexByChar = byChar;
        if (!this.achievCharId && d.chars.length) this.achievCharId = d.chars[0].id;
      } catch(e) {}
    },

    async fetchStickerbook() {
      try {
        const r = await fetch('/api/stickerbook');
        if (!r.ok) return;
        const d = await r.json();
        if (d.error) return;
        this.sbData = d;
      } catch(e) {}
    },

    sbCategories() {
      if (!this.sbData) return [];
      const cats = new Set(this.sbData.sets.map(s => s.category).filter(Boolean));
      return [...cats].sort();
    },

    sbCategorySummary() {
      if (!this.sbData) return [];
      const by = {};
      for (const s of this.sbData.sets) {
        const c = s.category || 'Unknown';
        if (!by[c]) by[c] = { name: c, collected: 0, total: 0 };
        by[c].collected += s.numCollected;
        by[c].total     += s.numTotal;
      }
      return Object.values(by).sort((a,b) => a.name.localeCompare(b.name));
    },

    sbCatPct(catName) {
      const sum = this.sbCategorySummary().find(c => c.name === catName);
      if (!sum || !sum.total) return 0;
      return Math.round(sum.collected / sum.total * 100);
    },

    sbSetsInCat(catName) {
      if (!this.sbData) return [];
      const q = this.sbSearch.toLowerCase();
      return this.sbData.sets.filter(s =>
        s.category === catName && (!q || s.name.toLowerCase().includes(q))
      );
    },

    sbSearchResults() {
      if (!this.sbData || !this.sbSearch) return [];
      const q = this.sbSearch.toLowerCase();
      return this.sbData.sets.filter(s => s.name.toLowerCase().includes(q));
    },

    sbSubcategories(catName) {
      if (!this.sbData) return [];
      const subs = new Set(
        this.sbData.sets
          .filter(s => s.category === catName && s.subcategory)
          .map(s => s.subcategory)
      );
      return [...subs].sort();
    },

    sbSetsInSubcat(catName, subcatName) {
      if (!this.sbData) return [];
      const q = this.sbSearch.toLowerCase();
      return this.sbData.sets.filter(s =>
        s.category === catName &&
        (subcatName ? s.subcategory === subcatName : !s.subcategory) &&
        (!q || s.name.toLowerCase().includes(q))
      );
    },

    achievItemsByCatSubcat(catName, subcatName) {
      const key = (catName || '') + '||' + (subcatName || '');
      const idx = this._achievIndexByChar[this.achievCharId];
      return idx ? (idx[key] || []) : [];
    },

    achievIconUrl(icon) {
      if (!icon) return '';
      return icon.replace('.dds', '.png');
    },

    async fetchAbilityIcons() {
      try {
        const r = await fetch('/api/ability_icons');
        if (!r.ok) return;
        this.abilityIcons = await r.json();
      } catch(e) {}
    },

    charWWBuilds(charId) {
      if (!this.wwBuilds || !charId) return [];
      return (this.wwBuilds.builds[String(charId)] || []).filter(b => this.wwBuildHasData(b));
    },

    wwBuildHasData(build) {
      if (build.gear && Object.keys(build.gear).length > 0) return true;
      if (this.buildHasSkills(build)) return true;
      if (this.buildHasCP(build)) return true;
      if (build.food) return true;
      return false;
    },

    mundusIcon(name) {
      if (!name) return '';
      const key = name.toLowerCase().replace(/^the\s+/, '');
      return `/assets/constellations/${key}.png`;
    },

    classIcon(cls) {
      if (!cls) return '';
      return `/assets/class/${cls.toLowerCase().replace(/\s+/g, '')}.png`;
    },

    raceIcon(race) {
      if (!race) return '';
      const map = {
        'Dark Elf': 'dunmer', 'High Elf': 'altmer', 'Wood Elf': 'bosmer',
        'Nord': 'nord', 'Khajiit': 'khajiit', 'Orc': 'orc',
        'Argonian': 'argonian', 'Breton': 'breton', 'Imperial': 'imperial',
        'Redguard': 'redguard',
      };
      const key = map[race] || race.toLowerCase().replace(/\s+/g, '_');
      return `/assets/races/${key}.png`;
    },

    allianceIcon(alliance) {
      if (!alliance) return '';
      const key = alliance.split(' ')[0].toLowerCase();
      return `/assets/alliance/${key}.png`;
    },

    wwGearName(g) {
      if (!g?.item_id) return g?.link_name || '—';
      return this.itemIdMap[g.item_id]?.name ?? g.link_name ?? `Item #${g.item_id}`;
    },

    wwGearColor(g) {
      if (!g?.item_id) return '#a02ee4';
      return this.itemIdMap[g.item_id]?.quality_color ?? '#a02ee4';
    },

    connectSSE() {
      const es = new EventSource('/events');
      es.onmessage = e => {
        if (e.data === 'reload') {
          Promise.all([this.fetchData(true), this.fetchAchievements(), this.fetchStickerbook()])
            .then(() => this.showToast('Data updated ✓'));
        }
      };
      es.onerror = () => setTimeout(() => this.connectSSE(), 5000);
    },

    showToast(msg) {
      this.toastMsg = msg;
      this.toastVisible = true;
      setTimeout(() => { this.toastVisible = false; }, 3000);
    },

    // ── Tooltip ──────────────────────────────────────────
    tipShow(item, evt) {
      this.tip.item = item;
      this.tip.slotLabel = null;
      this.tip.visible = true;
      this._tipPos(evt);
      if (item?.set_id && item?.set_name) this.fetchSetBonus(item.set_id, item.set_name);
    },
    tipShowSlot(item, slotLbl, evt) {
      this.tip.item = item;
      this.tip.slotLabel = slotLbl;
      this.tip.visible = true;
      this._tipPos(evt);
      if (item?.set_id && item?.set_name) this.fetchSetBonus(item.set_id, item.set_name);
    },
    _slugify(name) {
      return name.replace(/['''']/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    },
    skillbookUrl(name) {
      return `https://eso-skillbook.com/skill/${this._slugify(name)}`;
    },
    async fetchSkillInfo(name) {
      if (!name || name.startsWith('#')) return;
      const slug = this._slugify(name);
      if (this.skillInfoCache[slug] !== undefined) return;
      this.skillInfoCache[slug] = { loading: true };
      try {
        const r = await fetch(`/api/skill_info?name=${encodeURIComponent(name)}`);
        this.skillInfoCache[slug] = await r.json();
      } catch {
        this.skillInfoCache[slug] = { error: 'fetch failed' };
      }
    },
    tipShowSkill(abilityId, evt) {
      const name = this.abilityName(abilityId);
      if (!name || name.startsWith('#')) return;
      this.tip.item   = null;
      this.tip.achiev = null;
      this.tip.skill  = { name, slug: this._slugify(name) };
      this.tip.visible = true;
      this._tipPos(evt);
      this.fetchSkillInfo(name);
    },
    openSkillbook(abilityId) {
      const name = this.abilityName(abilityId);
      if (name && !name.startsWith('#')) window.open(this.skillbookUrl(name), '_blank');
    },
    setEsoSetsUrl(setName) {
      return `https://eso-sets.com/set/${this._slugify(setName)}`;
    },
    ttcUrl(pieceName) {
      const region = (this.data?.meta?.server || 'NA').toUpperCase() === 'EU' ? 'eu' : 'us';
      return `https://${region}.tamrieltradecentre.com/pc/Trade/SearchResult?ItemNamePattern=${encodeURIComponent(pieceName)}`;
    },
    async fetchSetBonus(setId, setName) {
      if (!setId || !setName || this.setBonusCache[setId] !== undefined) return;
      this.setBonusCache[setId] = { loading: true };
      try {
        const r = await fetch(`/api/set_bonus?set_id=${setId}&set_name=${encodeURIComponent(setName)}`);
        this.setBonusCache[setId] = await r.json();
      } catch {
        this.setBonusCache[setId] = { bonuses: [], error: 'fetch failed' };
      }
    },
    tipShowAchiev(a, evt) {
      this.tip.item = null;
      this.tip.achiev = a;
      this.tip.slotLabel = null;
      this.tip.visible = true;
      this._tipPos(evt);
    },
    tipShowSbSet(s, evt) {
      this.tip.item   = null;
      this.tip.achiev = null;
      this.tip.skill  = null;
      this.tip.sbSet  = s;
      this.tip.visible = true;
      this._tipPos(evt);
      this.fetchSetBonus(s.setId, s.name);
    },
    tipHide() {
      this.tip.visible = false;
      this.tip.achiev = null;
      this.tip.skill  = null;
      this.tip.sbSet  = null;
    },
    tipMove(evt) {
      if (this.tip.visible) this._tipPos(evt);
    },
    _tipPos(evt) {
      const W = 290, GAP = 14;
      let x = evt.clientX + GAP;
      let y = evt.clientY + GAP;
      if (x + W > window.innerWidth - 8)  x = evt.clientX - W - GAP;
      if (y + 300 > window.innerHeight - 8) y = evt.clientY - 300 - GAP;
      this.tip.x = Math.max(4, x);
      this.tip.y = Math.max(4, y);
    },

    // ── Characters ───────────────────────────────────────
    selectChar(char) {
      this.selectedChar = char;
      this.tipHide();
    },

    charBuilds(charId) {
      if (!this.builds || !charId) return [];
      return this.builds.builds.filter(b => b.char_id === charId && b.gear.length > 0);
    },

    get sortedCharacters() {
      if (!this.data) return [];
      return Object.values(this.data.characters).sort((a, b) => a.name.localeCompare(b.name));
    },

    _charSum(field) {
      if (!this.data) return 0;
      return Object.values(this.data.characters).reduce((s, c) => s + (c[field] || 0), 0);
    },

    get totalGold() { return this._charSum('gold') + (this.data?.bank?.gold || 0); },
    get totalAP()   { return this._charSum('ap')   + (this.data?.bank?.ap   || 0); },
    get totalTV()   { return this._charSum('tv')   + (this.data?.bank?.tv   || 0); },
    get totalWV()   { return this._charSum('wv')   + (this.data?.bank?.wv   || 0); },

    buildItemIdMap() {
      const m = {};
      for (const item of this.data.items) {
        if (item.item_id) m[item.item_id] = item;
      }
      this.itemIdMap = m;
    },

    buildTipShow(gear, evt) {
      const base = gear.item_id ? this.itemIdMap[gear.item_id] : null;
      // Always show tooltip: use iasync item for name/quality/filter metadata,
      // always override trait/style from the gear's own link/scan data.
      // Fall back to link-extracted name if the item isn't in the inventory.
      const item = {
        name:             base?.name            ?? gear.link_name ?? `Item #${gear.item_id}`,
        quality:          base?.quality         ?? 4,
        quality_name:     base?.quality_name    ?? 'Epic',
        quality_color:    base?.quality_color   ?? '#a02ee4',
        filter_type:      base?.filter_type     ?? 1,
        filter_type_name: base?.filter_type_name ?? 'Weapons',
        filter_type_icon: base?.filter_type_icon ?? '⚔',
        level:            base?.level           ?? 50,
        locations:        base?.locations       ?? [],
        total_quantity:   base?.total_quantity  ?? 0,
        weapon_type:      base?.weapon_type     ?? null,
        armor_type:       base?.armor_type      ?? null,
        is_stolen:        false,
        sell_value:       gear.sell_value       ?? 0,
        trait_id:         gear.trait_id,
        trait_name:       gear.trait_name,
        is_transmuted:    gear.is_transmuted,
        style_id:         gear.style_id,
        style_name:       gear.style_name,
        is_crafted:       gear.is_crafted,
        is_bound:         gear.is_bound,
        is_enchanted:     gear.is_enchanted,
        enchant_name:     gear.enchant_name     ?? base?.enchant_name ?? '',
        set_name:         gear.set_name         ?? base?.set_name     ?? '',
        set_id:           gear.set_id           ?? base?.set_id      ?? 0,
      };
      this.tipShowSlot(item, gear.slot_name, evt);
    },

    abilityName(id) {
      if (!id) return '';
      const n = this.builds?.abilityNames?.[String(id)];
      return n || '';
    },

    abilityIcon(id) {
      if (!id) return null;
      const name = this.abilityName(id);
      if (!name || name.startsWith('#')) return null;
      const key = name.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');
      return this.abilityIcons[key] || null;
    },

    abilitySlotHtml(id, isUlt) {
      const name = this.abilityName(id);
      const icon = this.abilityIcon(id);
      if (icon) {
        return `<img src="${icon}" class="skill-icon" alt="">`;
      }
      const cls = isUlt ? ' text-eso-gold' : '';
      return `<span class="px-1 py-0.5 text-xs${cls}">${name || ''}</span>`;
    },

    cpName(id) {
      if (!id) return '';
      const n = this.builds?.cpNames?.[String(id)];
      return n || '';
    },

    buildHasSkills(build) {
      if (!build.skills) return false;
      for (const bar of ['primary', 'backup'])
        if (build.skills[bar] && Object.keys(build.skills[bar]).length) return true;
      return false;
    },

    buildHasCP(build) {
      if (!build.cp) return false;
      return Object.values(build.cp).some(v => v > 0);
    },

    cpGroups(build) {
      return [
        { label: 'Craft',   color: '#A5DB52', icon: '/assets/interface/stamina.png', slots: ['1','2','3','4'] },
        { label: 'Warfare', color: '#5ABAE7', icon: '/assets/interface/magicka.png', slots: ['5','6','7','8'] },
        { label: 'Fitness', color: '#E76931', icon: '/assets/interface/health.png',  slots: ['9','10','11','12'] },
      ];
    },

    buildCharMaps() {
      const maps = {};
      for (const item of this.data.items) {
        for (const loc of item.locations) {
          if (loc.bag_id !== 0) continue;
          const cid = loc.location_key;
          if (!maps[cid]) maps[cid] = {};
          for (const slot of Object.keys(loc.bag_slots || {})) {
            maps[cid][parseInt(slot)] = { slot: parseInt(slot), item };
          }
        }
      }
      this.charMaps = maps;
    },

    slotLabel(slot) {
      return this.slotLabels[slot] || `Slot ${slot}`;
    },

    // HTML img tag for an item in a specific equipment SLOT (character sheet).
    // Off-hand slots (5, 21) are ambiguous (weapon or shield) so fall back to item type.
    slotEquipIcon(slot, item) {
      const G = '/assets/gear';
      const W = `${G}/weapon`;
      const img   = (src) => `<img src="${src}" class="w-8 h-8 object-contain" alt="">`;
      const iface = (name) => `<img src="/assets/interface/${name}.png" class="w-6 h-6 opacity-75" alt="">`;

      const WEAPON_ICONS = {
        'Dagger':            `${W}/gear_breton_dagger_d.webp`,
        'Sword':             `${W}/gear_breton_1hsword_d.webp`,
        'Axe':               `${W}/gear_breton_1haxe_d.webp`,
        'Hammer':            `${W}/gear_breton_1hhammer_d.webp`,
        'Two-Handed Sword':  `${W}/gear_breton_2hsword_d.webp`,
        'Two-Handed Axe':    `${W}/gear_breton_2haxe_d.webp`,
        'Two-Handed Hammer': `${W}/gear_breton_2hhammer_d.webp`,
        'Bow':               `${W}/gear_breton_bow_d.webp`,
        'Shield':            `${W}/gear_breton_shield_d.webp`,
      };
      // slot → armor piece name (light chest is "shirt")
      const ARMOR_SLOT = {
        0: 'head', 2: 'chest', 3: 'shoulders',
        6: 'waist', 8: 'legs', 9: 'feet', 16: 'hands',
      };

      const staffSrc = `${W}/gear_breton_staff_d.webp`;
      // Name-based fallback: ordered so longer/more-specific matches come first
      const nameToSrc = (n) => {
        if (n.includes('greatsword') || n.includes('great sword'))      return WEAPON_ICONS['Two-Handed Sword'];
        if (n.includes('battle axe') || n.includes('battleaxe') || n.includes('great axe')) return WEAPON_ICONS['Two-Handed Axe'];
        if (n.includes('maul'))                                         return WEAPON_ICONS['Two-Handed Hammer'];
        if (n.includes('staff'))                                        return staffSrc;
        if (n.includes('dagger'))                                       return WEAPON_ICONS['Dagger'];
        if (n.includes('sword') || n.includes('blade') || n.includes('saber') || n.includes('sabre') || n.includes('machete')) return WEAPON_ICONS['Sword'];
        if (n.includes('axe'))                                          return WEAPON_ICONS['Axe'];
        if (n.includes('hammer') || n.includes('mace'))                 return WEAPON_ICONS['Hammer'];
        if (n.includes('bow'))                                          return WEAPON_ICONS['Bow'];
        if (n.includes('shield'))                                       return WEAPON_ICONS['Shield'];
        return null;
      };
      const weaponImg = (wt, name) => {
        const nameLower = (name || '').toLowerCase();
        // iasync stores weapon type per-slot; discard it if it claims Staff but item name disagrees
        const resolvedWt = (wt && wt.includes('Staff') && !nameLower.includes('staff')) ? null : wt;
        if (!resolvedWt) {
          const src = nameToSrc(nameLower);
          return src ? img(src) : iface('inventory_weapons');
        }
        const src = WEAPON_ICONS[resolvedWt] ?? (resolvedWt.includes('Staff') ? staffSrc : null);
        return src ? img(src) : iface('inventory_weapons');
      };
      const armorImg = (s, at) => {
        const piece = ARMOR_SLOT[s];
        if (!piece || !at) return iface('inventory_armor');
        const w = at.toLowerCase();
        const p = (w === 'light' && piece === 'chest') ? 'shirt' : piece;
        return img(`${G}/armor/${w}/gear_breton_${w}_${p}_d.webp`);
      };

      if (slot in ARMOR_SLOT)                    return armorImg(slot, item.armor_type);
      if (slot === 1)                            return img(`${G}/jewelry/gear_breton_neck_a.webp`);
      if (slot === 11 || slot === 12)            return img(`${G}/jewelry/gear_breton_ring_a.webp`);
      if (slot===4||slot===5||slot===20||slot===21) return weaponImg(item.weapon_type, item.name);
      if (slot === 10)                           return iface('character_creation_body');
      if (slot === 13 || slot === 14)            return iface('inventory_consumables');
      // fallback by filter type (e.g. unrecognised slot numbers)
      if (item.filter_type === 1)  return weaponImg(item.weapon_type, item.name);
      if (item.filter_type === 2)  return armorImg(slot, item.armor_type);
      if (item.filter_type === 25) return img(`${G}/jewelry/gear_breton_neck_a.webp`);
      return iface('inventory_miscellaneous');
    },

    // Icon for an item anywhere in inventory / location lists.
    itemIconHtml(item) {
      const G = '/assets/gear';
      const W = `${G}/weapon`;
      const WEAPON_ICONS = {
        'Dagger':           `${W}/gear_breton_dagger_d.webp`,
        'Sword':            `${W}/gear_breton_1hsword_d.webp`,
        'Axe':              `${W}/gear_breton_1haxe_d.webp`,
        'Hammer':           `${W}/gear_breton_1hhammer_d.webp`,
        'Two-Handed Sword': `${W}/gear_breton_2hsword_d.webp`,
        'Two-Handed Axe':   `${W}/gear_breton_2haxe_d.webp`,
        'Two-Handed Hammer':`${W}/gear_breton_2hhammer_d.webp`,
        'Bow':              `${W}/gear_breton_bow_d.webp`,
        'Shield':           `${W}/gear_breton_shield_d.webp`,
      };
      const ARMOR_ICONS = {
        'Heavy':  `${G}/armor/heavy/gear_breton_heavy_chest_d.webp`,
        'Medium': `${G}/armor/medium/gear_breton_medium_chest_d.webp`,
        'Light':  `${G}/armor/light/gear_breton_light_shirt_d.webp`,
      };
      const FALLBACK = {
        1: '/assets/interface/inventory_weapons.png',
        2: '/assets/interface/inventory_armor.png',
        3: '/assets/interface/inventory_consumables.png',
        4: '/assets/interface/inventory_materials.png',
        5: '/assets/interface/inventory_miscellaneous.png',
        6: '/assets/interface/enchanting_potency.png',
      };

      const staffSrc = `${W}/gear_breton_staff_d.webp`;
      const nameToSrc = (n) => {
        if (n.includes('greatsword') || n.includes('great sword'))           return WEAPON_ICONS['Two-Handed Sword'];
        if (n.includes('battle axe') || n.includes('battleaxe') || n.includes('great axe')) return WEAPON_ICONS['Two-Handed Axe'];
        if (n.includes('maul'))                                              return WEAPON_ICONS['Two-Handed Hammer'];
        if (n.includes('staff'))                                             return staffSrc;
        if (n.includes('dagger'))                                            return WEAPON_ICONS['Dagger'];
        if (n.includes('sword') || n.includes('blade') || n.includes('saber') || n.includes('sabre') || n.includes('machete')) return WEAPON_ICONS['Sword'];
        if (n.includes('axe'))                                               return WEAPON_ICONS['Axe'];
        if (n.includes('hammer') || n.includes('mace'))                      return WEAPON_ICONS['Hammer'];
        if (n.includes('bow'))                                               return WEAPON_ICONS['Bow'];
        if (n.includes('shield'))                                            return WEAPON_ICONS['Shield'];
        return null;
      };
      let src = null;
      if (item.filter_type === 1) {
        const nameLower = (item.name || '').toLowerCase();
        const wt = (item.weapon_type && item.weapon_type.includes('Staff') && !nameLower.includes('staff'))
          ? null : item.weapon_type;
        src = WEAPON_ICONS[wt]
          ?? (wt && wt.includes('Staff') ? staffSrc : null)
          ?? nameToSrc(nameLower)
          ?? FALLBACK[1];
      } else if (item.filter_type === 2) {
        if (item.weapon_type === 'Shield') src = `${W}/gear_breton_shield_d.webp`;
        else src = ARMOR_ICONS[item.armor_type] ?? FALLBACK[2];
      } else if (item.filter_type === 25) {
        src = `${G}/jewelry/gear_breton_neck_a.webp`;
      } else {
        src = FALLBACK[item.filter_type];
      }
      if (src) return `<img src="${src}" class="w-7 h-7 object-contain" alt="">`;
      return item.filter_type_icon;
    },

    fmtGold(n) {
      if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
      if (n >= 1e3) return (n/1e3).toFixed(1)+'k';
      return n.toString();
    },
    fmtNum(n) { return n.toLocaleString(); },

    spaceColor(char) {
      const p = char.space_max ? char.space_used / char.space_max : 0;
      return p > 0.9 ? '#ef4444' : p > 0.75 ? '#f59e0b' : '#2dc50e';
    },

    // ── Inventory ────────────────────────────────────────
    setSort(key) {
      if (this.sortKey === key) this.sortDir = this.sortDir === 'asc' ? 'desc' : 'asc';
      else { this.sortKey = key; this.sortDir = 'asc'; }
    },
    sortIndicator(key) {
      return this.sortKey === key ? (this.sortDir === 'asc' ? ' ↑' : ' ↓') : '';
    },

    get filteredItems() {
      if (!this.data) return [];
      let items = this.data.items;
      const q = this.search.toLowerCase().trim();
      if (q) items = items.filter(i => i.name.toLowerCase().includes(q));
      if (this.filterQuality !== '') items = items.filter(i => i.quality === parseInt(this.filterQuality));
      if (this.filterTypes.length) items = items.filter(i => this.filterTypes.includes(String(i.filter_type)));
      if (this.filterLocTypes.length || this.filterChars.length) {
        items = items.filter(item =>
          item.locations.some(loc => {
            if (this.filterLocTypes.length && !this.filterLocTypes.includes(loc.location_type)) return false;
            if (this.filterChars.length && !this.filterChars.includes(loc.location_key)) return false;
            return true;
          })
        );
      }
      if (this.filterTraits.length) {
        if (this.filterTraits.includes('any')) items = items.filter(i => i.trait_id > 0);
        else items = items.filter(i => this.filterTraits.includes(String(i.trait_id)));
      }
      if (this.filterTransmuted) items = items.filter(i => i.is_transmuted);
      if (this.filterCrafted)    items = items.filter(i => i.is_crafted);
      const k = this.sortKey, dir = this.sortDir === 'asc' ? 1 : -1;
      return [...items].sort((a, b) => {
        const av = a[k], bv = b[k];
        return typeof av === 'string' ? dir * av.localeCompare(bv) : dir * (av - bv);
      });
    },

    get groupedItems() {
      const groups = {};
      const noSet = [];
      for (const item of this.filteredItems) {
        if (item.set_name) {
          if (!groups[item.set_name]) groups[item.set_name] = [];
          groups[item.set_name].push(item);
        } else noSet.push(item);
      }
      const result = [];
      for (const [set, items] of Object.entries(groups).sort((a, b) => a[0].localeCompare(b[0])))
        result.push({ set, count: items.length, items });
      if (noSet.length) result.push({ set: null, count: noSet.length, items: noSet });
      return result;
    },

    get displayItems() {
      if (!this.filterGroupBySet) return this.filteredItems.map(item => ({ t: 'item', item }));
      const result = [];
      for (const group of this.groupedItems) {
        result.push({ t: 'h', set: group.set || 'No Set', count: group.count });
        for (const item of group.items) result.push({ t: 'item', item });
      }
      return result;
    },

    toggleFilter(arr, val) {
      const idx = arr.indexOf(val);
      if (idx >= 0) arr.splice(idx, 1);
      else arr.push(val);
    },

    get filterTypeLabel() {
      if (!this.filterTypes.length) return 'All Types';
      const map = {'1':'Weapons','2':'Armor','25':'Jewelry','3':'Consumables','4':'Materials','6':'Glyphs','21':'Furnishings','5':'Misc'};
      const names = this.filterTypes.map(v => map[v] || v);
      return names.length <= 2 ? names.join(', ') : `${names[0]} +${names.length - 1}`;
    },

    get filterLocTypeLabel() {
      if (!this.filterLocTypes.length) return 'All Locations';
      const map = {'character':'Characters','bank':'Bank','craftbag':'Craft Bag','house_chest':'House Chests'};
      const names = this.filterLocTypes.map(v => map[v] || v);
      return names.length <= 2 ? names.join(', ') : `${names[0]} +${names.length - 1}`;
    },

    get filterCharLabel() {
      if (!this.filterChars.length) return 'All Characters';
      const names = this.filterChars.map(id => {
        const c = this.sortedCharacters.find(c => c.id === id);
        return c ? c.name.split(' ')[0] : id;
      });
      return names.length <= 2 ? names.join(', ') : `${names[0]} +${names.length - 1}`;
    },

    get filterTraitLabel() {
      if (!this.filterTraits.length) return 'All Traits';
      if (this.filterTraits.includes('any')) return 'Has Trait';
      if (this.filterTraits.length === 1) return this._traitName(this.filterTraits[0]);
      return `${this.filterTraits.length} Traits`;
    },

    _traitName(v) {
      const m = {'18':'Divines','16':'Infused','25':'Nirnhoned','13':'Reinforced','11':'Sturdy','14':'Well-Fitted','12':'Impenetrable','15':'Training','4':'Infused','26':'Nirnhoned','5':'Defending','2':'Charged','7':'Sharpened','1':'Powered','3':'Precise','8':'Decisive','6':'Training','32':'Protective','29':'Harmony','31':'Bloodthirsty','30':'Triune','33':'Infused','28':'Swift','22':'Arcane','21':'Healthy','23':'Robust'};
      return m[v] || v;
    },

    get hasActiveFilters() {
      return this.search || this.filterQuality !== '' || this.filterTypes.length ||
             this.filterLocTypes.length || this.filterChars.length || this.filterTraits.length ||
             this.filterTransmuted || this.filterCrafted || this.filterGroupBySet;
    },

  };
}
</script>
